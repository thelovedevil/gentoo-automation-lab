---
# Role: desktop — bspwm + sxhkd + sakura + picom + polybar + Xorg (modesetting).
# Stage B. GPU driver = Phase 2 (nvidia); modesetting is the generic fallback.
# make.conf and user creation handled in playbook pre_tasks.

- name: "[B] Install Xorg + desktop packages"
  ansible.builtin.command: >-
    emerge --noreplace {{ desktop_packages | join(' ') }}
  changed_when: true
  async: 14400
  poll: 60

- name: "[B] Create XDG config directories"
  ansible.builtin.file:
    path: "{{ operator_home }}/.config/{{ item }}"
    state: directory
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0755"
  loop:
    - bspwm
    - sxhkd
    - picom
    - polybar

- name: "[B] Deploy bspwmrc"
  ansible.builtin.copy:
    dest: "{{ operator_home }}/.config/bspwm/bspwmrc"
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0755"
    content: |
      #!/bin/sh
      # ---- monitors ----
      # Dynamically assign desktops to all connected monitors
      monitors=$(xrandr --query | grep ' connected' | cut -d' ' -f1)
      count=$(echo "$monitors" | wc -l)
      if [ "$count" -eq 1 ]; then
          bspc monitor "$(echo $monitors | head -1)" -d 一 二 三 四 五 六 七 八 九 十
      else
          bspc monitor "$(echo $monitors | sed -n 1p)" -d 一 二 三 四 五
          bspc monitor "$(echo $monitors | sed -n 2p)" -d 六 七 八 九 十
      fi

      # ---- global settings ----
      bspc config border_width          2
      bspc config window_gap            0
      bspc config split_ratio           0.52
      bspc config borderless_monocle    true
      bspc config gapless_monocle       true
      bspc config focus_follows_pointer true

      # ---- colors (vermillion on sumi black) ----
      bspc config normal_border_color   "#0A0A0A"
      bspc config active_border_color   "#0A0A0A"
      bspc config focused_border_color  "#B7410E"
      bspc config presel_feedback_color "#CE5C5C"

      # ---- rules ----
      bspc rule -a Emacs desktop='^3' state=tiled

      # ---- autostart ----
      pgrep -x sxhkd > /dev/null || sxhkd &
      pgrep -x picom > /dev/null || picom --daemon &
      if ! pgrep -x polybar > /dev/null; then
          for m in $(xrandr --query | grep ' connected' | cut -d' ' -f1); do
              MONITOR=$m polybar main &
          done
      fi
      pgrep -x dunst > /dev/null || dunst &

      # wallpaper (scaled to fit, centered on black background)
      [ -f ~/.local/share/wallpapers/wall.jpg ] && feh --no-xinerama --bg-center --image-bg '#000000' ~/.local/share/wallpapers/wall.jpg &

- name: "[B] Deploy sxhkdrc"
  ansible.builtin.copy:
    dest: "{{ operator_home }}/.config/sxhkd/sxhkdrc"
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0644"
    content: |
      # ---- wm independent ----
      # terminal
      super + Return
      	sakura

      # launcher
      super + d
      	dmenu_run -fn 'Noto Sans CJK JP:size=9' -nb '#000000' -nf '#D4C5AA' -sb '#B7410E' -sf '#D4C5AA'

      # emacs
      super + e
      	emacs

      # reload sxhkd
      super + Escape
      	pkill -USR1 -x sxhkd

      # ---- bspwm hotkeys ----
      # quit/restart bspwm
      super + alt + {q,r}
      	bspc {quit,wm -r}

      # close/kill node
      super + {_,shift + }w
      	bspc node -{c,k}

      # focus/swap node in direction
      super + {_,shift + }{h,j,k,l}
      	bspc node -{f,s} {west,south,north,east}

      # focus desktop
      super + {1-9,0}
      	bspc desktop -f '^{1-9,10}'

      # send to desktop
      super + shift + {1-9,0}
      	bspc node -d '^{1-9,10}'

      # toggle floating/fullscreen
      super + {s,f}
      	bspc node -t {floating,fullscreen}

      # toggle tiled
      super + t
      	bspc node -t tiled

      # screenshot (requires scrot)
      Print
      	scrot '%Y-%m-%d_%H-%M-%S.png' -e 'mv $f ~/screenshots/'

- name: "[B] Deploy picom.conf"
  ansible.builtin.copy:
    dest: "{{ operator_home }}/.config/picom/picom.conf"
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0644"
    content: |
      # backend
      backend = "glx";

      # opacity
      active-opacity = 0.92;
      inactive-opacity = 0.85;
      frame-opacity = 0.9;

      opacity-rule = [
        "95:class_g = 'Emacs'",
        "90:class_g = 'sakura'"
        # sakura VTE alpha handles translucency; compositor at 100% keeps text crisp
      ];

      # fade
      fading = true;
      fade-delta = 4;
      fade-in-step = 0.03;
      fade-out-step = 0.03;

      # shadow
      shadow = true;
      shadow-radius = 12;
      shadow-offset-x = -7;
      shadow-offset-y = -7;
      shadow-opacity = 0.6;
      shadow-color = "#000000";
      shadow-exclude = [
        "name = 'Notification'",
        "class_g = 'Polybar'"
      ];

      # corners
      corner-radius = 6;

      # blur
      blur-method = "dual_kawase";
      blur-strength = 3;
      blur-background-exclude = [
        "window_type = 'dock'"
      ];

      # vsync
      vsync = true;

- name: "[B] Deploy polybar config"
  ansible.builtin.copy:
    dest: "{{ operator_home }}/.config/polybar/config.ini"
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0644"
    content: |
      [colors]
      background = #000000
      background-alt = #0A0A0A
      foreground = #D4C5AA
      primary = #B7410E
      secondary = #CE5C5C
      alert = #B7282E
      disabled = #505050

      [bar/main]
      monitor = ${env:MONITOR:}
      width = 100%
      height = 20pt
      radius = 0
      background = ${colors.background}
      foreground = ${colors.foreground}
      line-size = 1pt
      border-bottom-size = 0
      padding-left = 2
      padding-right = 2
      module-margin = 2
      separator = ·
      separator-foreground = ${colors.disabled}
      font-0 = "Noto Sans CJK JP:size=8:weight=light;2"
      font-1 = "Noto Sans Mono:size=8;2"
      modules-left = bspwm
      modules-center = date
      modules-right = memory cpu network

      [module/bspwm]
      type = internal/bspwm
      label-focused = %name%
      label-focused-foreground = ${colors.primary}
      label-focused-background = ${colors.background-alt}
      label-focused-underline = ${colors.primary}
      label-focused-padding = 1
      label-occupied = %name%
      label-occupied-foreground = ${colors.foreground}
      label-occupied-padding = 1
      label-urgent = %name%
      label-urgent-foreground = ${colors.background}
      label-urgent-background = ${colors.alert}
      label-urgent-padding = 1
      label-empty = %name%
      label-empty-foreground = ${colors.disabled}
      label-empty-padding = 1

      [module/cpu]
      type = internal/cpu
      interval = 2
      format-prefix = "処理 "
      format-prefix-foreground = ${colors.primary}
      format-prefix-font = 1
      label = %percentage:2%%
      label-font = 2

      [module/memory]
      type = internal/memory
      interval = 2
      format-prefix = "記憶 "
      format-prefix-foreground = ${colors.primary}
      format-prefix-font = 1
      label = %percentage_used:2%%
      label-font = 2

      [module/network]
      type = internal/network
      interface-type = wired
      interval = 5
      format-connected = <label-connected>
      format-connected-prefix = "網 "
      format-connected-prefix-foreground = ${colors.primary}
      label-connected = %local_ip%
      label-connected-foreground = ${colors.foreground}
      label-disconnected = 切断
      label-disconnected-foreground = ${colors.disabled}

      [module/date]
      type = internal/date
      interval = 1
      date = %Y年%m月%d日 %H:%M
      label = %date%
      label-foreground = ${colors.foreground}

      [settings]
      screenchange-reload = true

- name: "[B] Create dunst config directory"
  ansible.builtin.file:
    path: "{{ operator_home }}/.config/dunst"
    state: directory
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0755"

- name: "[B] Deploy dunstrc"
  ansible.builtin.copy:
    dest: "{{ operator_home }}/.config/dunst/dunstrc"
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0644"
    content: |
      [global]
      font = Noto Sans CJK JP 9
      format = "<b>%s</b>\n%b"
      alignment = right
      origin = top-right
      offset = 8x8
      frame_width = 1
      frame_color = "#B7410E"
      separator_color = frame
      corner_radius = 4
      transparency = 10
      padding = 8
      horizontal_padding = 12
      icon_position = off

      [urgency_low]
      background = "#000000"
      foreground = "#D4C5AA"
      timeout = 4

      [urgency_normal]
      background = "#000000"
      foreground = "#D4C5AA"
      timeout = 8

      [urgency_critical]
      background = "#0A0A0A"
      foreground = "#B7282E"
      frame_color = "#B7282E"
      timeout = 0

- name: "[B] Create wallpaper directory"
  ansible.builtin.file:
    path: "{{ operator_home }}/.local/share/wallpapers"
    state: directory
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0755"

- name: "[B] Ensure .xinitrc starts bspwm"
  ansible.builtin.copy:
    dest: "{{ operator_home }}/.xinitrc"
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0755"
    content: |
      #!/bin/sh
      # Compositing
      picom --daemon &
      # Status bar
      polybar &
      # Hotkey daemon
      sxhkd &
      # Window manager
      exec bspwm
