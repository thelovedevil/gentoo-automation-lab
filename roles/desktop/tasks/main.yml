---
# Role: desktop — bspwm + sxhkd + sakura + picom + polybar + Xorg (modesetting).
# Stage B. GPU driver = Phase 2 (nvidia); modesetting is the generic fallback.
# make.conf and user creation handled in playbook pre_tasks.

- name: "[B] Install Xorg + desktop packages"
  ansible.builtin.command: >-
    emerge --noreplace {{ desktop_packages | join(' ') }}
  changed_when: true
  async: 14400
  poll: 60

- name: "[B] Create XDG config directories"
  ansible.builtin.file:
    path: "{{ operator_home }}/.config/{{ item }}"
    state: directory
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0755"
  loop:
    - bspwm
    - sxhkd
    - picom
    - polybar

- name: "[B] Deploy bspwmrc"
  ansible.builtin.copy:
    dest: "{{ operator_home }}/.config/bspwm/bspwmrc"
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0755"
    content: |
      #!/bin/sh
      # ---- monitors ----
      bspc monitor -d 一 二 三 四 五 六 七 八 九 十

      # ---- global settings ----
      bspc config border_width          2
      bspc config window_gap            0
      bspc config split_ratio           0.52
      bspc config borderless_monocle    true
      bspc config gapless_monocle       true
      bspc config focus_follows_pointer true

      # ---- colors (dark with red accents) ----
      bspc config normal_border_color   "#282828"
      bspc config active_border_color   "#282828"
      bspc config focused_border_color  "#c25e5e"
      bspc config presel_feedback_color "#dc7171"

      # ---- rules ----
      bspc rule -a Emacs desktop='^3' state=tiled

      # ---- autostart ----
      pgrep -x sxhkd > /dev/null || sxhkd &
      pgrep -x picom > /dev/null || picom --daemon &
      pgrep -x polybar > /dev/null || polybar main &
      pgrep -x dunst > /dev/null || dunst &

      # wallpaper (scaled to fit, centered on black background)
      [ -f ~/.local/share/wallpapers/wall.jpg ] && feh --bg-max --image-bg '#000000' ~/.local/share/wallpapers/wall.jpg &

- name: "[B] Deploy sxhkdrc"
  ansible.builtin.copy:
    dest: "{{ operator_home }}/.config/sxhkd/sxhkdrc"
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0644"
    content: |
      # ---- wm independent ----
      # terminal
      super + Return
      	sakura

      # launcher
      super + d
      	dmenu_run -nb '#000000' -nf '#d0d0d0' -sb '#c25e5e' -sf '#000000'

      # emacs
      super + e
      	emacs

      # reload sxhkd
      super + Escape
      	pkill -USR1 -x sxhkd

      # ---- bspwm hotkeys ----
      # quit/restart bspwm
      super + alt + {q,r}
      	bspc {quit,wm -r}

      # close/kill node
      super + {_,shift + }w
      	bspc node -{c,k}

      # focus/swap node in direction
      super + {_,shift + }{h,j,k,l}
      	bspc node -{f,s} {west,south,north,east}

      # focus desktop
      super + {1-9,0}
      	bspc desktop -f '^{1-9,10}'

      # send to desktop
      super + shift + {1-9,0}
      	bspc node -d '^{1-9,10}'

      # toggle floating/fullscreen
      super + {s,f}
      	bspc node -t {floating,fullscreen}

      # toggle tiled
      super + t
      	bspc node -t tiled

      # screenshot (requires scrot)
      Print
      	scrot '%Y-%m-%d_%H-%M-%S.png' -e 'mv $f ~/screenshots/'

- name: "[B] Deploy picom.conf"
  ansible.builtin.copy:
    dest: "{{ operator_home }}/.config/picom/picom.conf"
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0644"
    content: |
      # backend
      backend = "glx";

      # opacity
      active-opacity = 0.92;
      inactive-opacity = 0.85;
      frame-opacity = 0.9;

      opacity-rule = [
        "100:class_g = 'LibreWolf'",
        "95:class_g = 'Emacs'",
        "90:class_g = 'sakura'"
      ];

      # fade
      fading = true;
      fade-delta = 4;
      fade-in-step = 0.03;
      fade-out-step = 0.03;

      # shadow
      shadow = true;
      shadow-radius = 12;
      shadow-offset-x = -7;
      shadow-offset-y = -7;
      shadow-opacity = 0.6;
      shadow-color = "#000000";
      shadow-exclude = [
        "name = 'Notification'",
        "class_g = 'Polybar'"
      ];

      # corners
      corner-radius = 6;

      # blur
      blur-method = "dual_kawase";
      blur-strength = 3;
      blur-background-exclude = [
        "window_type = 'dock'"
      ];

      # vsync
      vsync = true;

- name: "[B] Create wallpaper directory"
  ansible.builtin.file:
    path: "{{ operator_home }}/.local/share/wallpapers"
    state: directory
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0755"

- name: "[B] Ensure .xinitrc starts bspwm"
  ansible.builtin.copy:
    dest: "{{ operator_home }}/.xinitrc"
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0755"
    content: |
      #!/bin/sh
      # Compositing
      picom --daemon &
      # Status bar
      polybar &
      # Hotkey daemon
      sxhkd &
      # Window manager
      exec bspwm
