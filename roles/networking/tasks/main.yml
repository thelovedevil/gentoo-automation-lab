---
# Role: networking — VPN, anonymity, packet analysis, advanced net tooling.
# Stage B. Wireguard module is in the dist-kernel; tools-only here.

- name: "[B] Set wireshark to CLI-only (no Qt GUI)"
  ansible.builtin.copy:
    dest: /etc/portage/package.use/wireshark
    mode: "0644"
    content: "net-analyzer/wireshark -qt6\n"

- name: "[B] Install networking / VPN / anonymity packages"
  ansible.builtin.command: >-
    emerge --noreplace {{ network_packages | join(' ') }}
  changed_when: true
  async: 7200
  poll: 60

- name: "[B] Enable tor service (stopped by default; manual start)"
  ansible.builtin.command: rc-update add tor default
  changed_when: true
  ignore_errors: true

# ---- DNS hardening (prevent ISP leak) ----
- name: "[B] Pin DNS to gateway (resolv.conf.head)"
  ansible.builtin.copy:
    dest: /etc/resolv.conf.head
    mode: "0644"
    content: |
      # DNS via gateway (forwards to upstream resolver over VPN tunnel)
      nameserver {{ gateway_dns | default('192.168.1.1') }}

- name: "[B] Pin DNS in resolvconf.conf"
  ansible.builtin.lineinfile:
    path: /etc/resolvconf.conf
    regexp: '^#?name_servers='
    line: "name_servers={{ gateway_dns | default('192.168.1.1') }}"

- name: "[B] Prevent dhcpcd from overwriting resolv.conf"
  ansible.builtin.lineinfile:
    path: /etc/dhcpcd.conf
    line: 'nohook resolv.conf'
    create: true

- name: "[B] Enable IPv6 with stable private addresses in dhcpcd"
  ansible.builtin.blockinfile:
    path: /etc/dhcpcd.conf
    marker: "# {mark} IPv6 config"
    block: |
      slaac private
